events {}

http {

    server {

        listen 80;

        location /api/ {

            proxy_pass http://api:5000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

        }

        location / {

            return 200 "SRE Lab NGINX funcionando\n";
            add_header Content-Type text/plain;

        }

    }

}
