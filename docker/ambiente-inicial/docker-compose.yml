services:

  nginx:
    image: nginx:latest
    container_name: sre-nginx
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: always
    networks:
      - sre-network


  api:
    image: sre-api:latest
    container_name: sre-api
    ports:
      - "5000:5000"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: always

    networks:
      - sre-network


  prometheus:
    image: prom/prometheus:latest
    container_name: sre-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      api:
        condition: service_healthy

    restart: always

    networks:
      - sre-network


  grafana:
    image: grafana/grafana:latest
    container_name: sre-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana-data:/var/lib/grafana

    restart: always

    networks:
      - sre-network


  node-exporter:
    image: prom/node-exporter:latest
    container_name: sre-node-exporter

    ports:
      - "9100:9100"

    restart: always

    networks:
      - sre-network


networks:

  sre-network:
    driver: bridge


volumes:

  grafana-data:
