services:

  nginx:
    image: nginx:latest
    container_name: sre-nginx

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    restart: always

    networks:
      - sre-network


  api:
    image: sre-api:latest
    container_name: sre-api

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: always

    networks:
      - sre-network


networks:

  sre-network:
    driver: bridge
