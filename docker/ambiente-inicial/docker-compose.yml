services:

  nginx:
    image: nginx:latest
    container_name: sre-nginx
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: always
    networks:
      - sre-network

  api:
    image: sre-api:latest
    container_name: sre-api
    ports:
      - "5000:5000"
    restart: always
    networks:
      - sre-network


networks:

  sre-network:
    driver: bridge
