receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: normal

  otlphttp/dynatrace:
    endpoint: https://cqs16759.live.dynatrace.com/api/v2/otlp
    headers:
      Authorization: "Api-Token ${DT_API_TOKEN}"

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger, otlphttp/dynatrace]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/dynatrace]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/dynatrace]

